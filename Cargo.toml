[package]
name = "proofstop"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A research controller for cost-aware early exit in verifiable reasoning"
repository = "https://github.com/Atharva-Kanherkar/proofstop"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "net"] }
uuid = { version = "1", features = ["v4"] }
